<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>国产淡水三文鱼 · 避雷飞字</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0709}
canvas{display:block;position:absolute;top:0;left:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ================================================================
   Flying Words Tunnel — 国产淡水三文鱼避雷主题
   按 spec card: 黄金角铺位 + z轴透视推进 + 生命曲线 + 擦身而过
   6秒2循环无缝 + 风险词红橙警示配色
   「国产淡水三文鱼」七字常驻屏幕中央，结尾原位点亮
   ================================================================ */
(function(){
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W,H,P;
  function resize(){
    W = cv.width = window.innerWidth;
    H = cv.height = window.innerHeight;
    P = 4400;  /* perspective 原生值 */
  }
  resize(); window.addEventListener('resize', resize);

  /* ----- 避雷主题 19 词（去重后；长词自动缩字号） ----- */
  var WORDS = [
    '重金属','水质污染','养殖密度','生食风险','不能生吃',
    '必须熟食','冷冻杀虫不彻底','淡水鱼不生吃','不推荐','谨慎消费',
    '只敢熟食','虹鳟不是三文鱼','国产淡水三文鱼避雷','生食虹鳟风险','指虹为鲑',
    '三文鱼标准之争','假三文鱼','三文鱼智商税','生食三文鱼团体标准争议'
  ];
  var EMPHASIS = [4,7,11,12,14,16];  /* 红橙强调词索引 */
  var COLORS = {
    light:  ['#fff3ea','#e6c9b8','#b3927f'],
    emp:    '#ff7a5c',
    empGlow:'rgba(255,122,92,'
  };

  /* ----- 确定性伪随机 ----- */
  function rand(i){
    var x = Math.sin((i*9301+49297)*0.0001)*233280;
    return x - Math.floor(x);
  }

  /* ----- 词对象 ----- */
  var N = WORDS.length;
  var CYCLIC = 2;  /* 整数圈无缝循环 */
  var DUR = 6.0;   /* 秒 */

  var items = [];
  for(var i=0; i<N; i++){
    var a = i*2.39996 + rand(i*7+1)*0.8;     /* 黄金角 */
    var r = 330 + rand(i)*660;                 /* 半径 */
    var lenAdj = 6 / Math.max(5, WORDS[i].length);  /* 长词缩字号，避免溢出 */
    items.push({
      text: WORDS[i],
      emphasis: EMPHASIS.indexOf(i)>=0,
      angle: a, r: r,
      yScale: 0.6,
      spawnZ: -7000, endZ: 3200,
      phase: i/N,                              /* 均分相位 */
      fontSize: (64 + rand(i+100)*56) * lenAdj,
      baseAlpha: 1.0
    });
  }

  /* ----- 生命曲线插值 ----- */
  var OT = [0, 0.25, 0.6, 0.85, 1];
  var OP = [0, 1, 0.5, 0.2, 0];
  function life(u){
    if(u<=0) return 0;
    if(u>=1) return 0;
    for(var k=0; k<4; k++){
      if(u>=OT[k] && u<=OT[k+1]){
        var p = (u-OT[k])/(OT[k+1]-OT[k]);
        return OP[k] + (OP[k+1]-OP[k])*p;
      }
    }
    return 0;
  }

  /* ----- 隧道壁发丝环 ----- */
  var hairRings = [];
  for(var k=0; k<10; k++){
    hairRings.push({
      baseR: 330 + k*66,
      phase: k/10,
      thickness: 1 + k*0.4
    });
  }

  /* ----- 尘埃流线 ----- */
  var dust = [];
  for(var d=0; d<56; d++){
    dust.push({
      angle: d*0.4 + rand(d*3)*0.6,
      r: 100 + rand(d+50)*800,
      zPhase: rand(d+200),
      speed: 0.8 + rand(d+300)*0.6,
      len: 40 + rand(d+400)*80
    });
  }

  /* ----- 中心光晕 ----- */
  function drawHalo(t){
    var pulse = 0.82 + Math.sin(t*4*Math.PI)*0.14;  /* 呼吸2次/6秒 */
    var cx = W/2, cy = H/2;
    var g = ctx.createRadialGradient(cx,cy,0, cx,cy, Math.min(W,H)*0.55);
    g.addColorStop(0, 'rgba(255,140,100,'+(0.26*pulse)+')');
    g.addColorStop(0.25, 'rgba(255,90,60,'+(0.11*pulse)+')');
    g.addColorStop(0.6, 'rgba(60,20,15,0.08)');
    g.addColorStop(1, 'rgba(10,7,9,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }

  /* ----- 暗角 ----- */
  function drawVignette(){
    var cx = W/2, cy = H/2;
    var g = ctx.createRadialGradient(cx,cy,Math.min(W,H)*0.25, cx,cy,Math.max(W,H)*0.7);
    g.addColorStop(0, 'rgba(10,7,9,0)');
    g.addColorStop(1, 'rgba(5,3,7,0.92)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }

  /* ----- 渲染一帧 ----- */
  function frame(t){
    var cx = W/2, cy = H/2;
    var DPR = Math.min(window.devicePixelRatio||1, 2);

    ctx.fillStyle = '#0a0709';
    ctx.fillRect(0,0,W,H);

    /* 隧道整体极缓滚转 ±2.5度 */
    var tunnelRot = Math.sin(t*2*Math.PI) * 2.5 * Math.PI/180;
    var cosR = Math.cos(tunnelRot), sinR = Math.sin(tunnelRot);

    /* --- 尘埃流线 --- */
    dust.forEach(function(d){
      var dz = ((t*0.15*d.speed + d.zPhase) % 1);
      /* dz: 0远→1近 */
      var z = -7000 + dz*10200;
      if(z < -6800 || z > 3000) return;
      var s = P/(P-z);
      var drift = 0.5 + dz*1.35;
      var rx = d.r * drift * Math.cos(d.angle);
      var ry = d.r * drift * Math.sin(d.angle) * 0.6;
      var px = cx + rx * s;
      var py = cy + ry * s;
      /* 方向拖尾：沿 -v 方向延长 */
      var vx = rx*s*0.02, vy = ry*s*0.02;
      ctx.save();
      ctx.globalAlpha = life(dz)*0.4;
      ctx.strokeStyle = '#ff8a6a';
      ctx.lineWidth = Math.max(0.5, s*1.5);
      ctx.beginPath();
      ctx.moveTo(px-vx*d.len, py-vy*d.len);
      ctx.lineTo(px, py);
      ctx.stroke();
      ctx.restore();
    });

    /* --- 隧道壁发丝环 --- */
    hairRings.forEach(function(hr){
      var hz = ((t/DUR*CYCLIC + hr.phase) % 1);
      var z = -7000 + hz*10200;
      if(z < -6800 || z > 3000) return;
      var s = P/(P-z);
      var drift = 0.5 + hz*1.35;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(tunnelRot);
      ctx.globalAlpha = life(hz)*0.35;
      ctx.strokeStyle = '#ff6a4d';
      ctx.lineWidth = Math.max(0.3, hr.thickness * s * 0.6);
      ctx.beginPath();
      /* 扁椭圆 */
      for(var a=0; a<Math.PI*2; a+=0.12){
        var ex = hr.baseR*drift*Math.cos(a) * s;
        var ey = hr.baseR*drift*Math.sin(a)*0.6 * s;
        if(a===0) ctx.moveTo(ex,ey); else ctx.lineTo(ex,ey);
      }
      ctx.stroke();
      ctx.restore();
    });

    /* --- 中心光晕 --- */
    drawHalo(t);

    /* --- 词语 --- */
    items.forEach(function(it){
      /* 时间推进：每个词按自己的 phase 起始，整圈重复 */
      var rawT = (t/DUR*CYCLIC + it.phase) % 1;
      var u = rawT;  /* 0远→1近 */

      var z = it.spawnZ + u*(it.endZ - it.spawnZ);
      var s = P/(P-z);
      var drift = 0.5 + u*1.35;

      var rx = it.r * drift * Math.cos(it.angle);
      var ry = it.r * drift * Math.sin(it.angle) * it.yScale;
      /* 隧道滚转 */
      var rx2 = rx*cosR - ry*sinR;
      var ry2 = rx*sinR + ry*cosR;

      var px = cx + rx2 * s;
      var py = cy + ry2 * s;

      /* 生命曲线 */
      var op = life(u);

      /* 中央字标区让位：飞进「国产淡水三文鱼」区域的词压暗 */
      var centralDim = 1;
      var dxE = (px-cx)/(Math.min(W,H)*0.46);
      var dyE = (py-cy)/(Math.min(W,H)*0.20);
      var dEll = Math.sqrt(dxE*dxE + dyE*dyE);
      if(dEll < 1) centralDim = Math.max(0.22, dEll);

      /* 近端糊化：u>0.86 起线性失焦 */
      var blur = 0;
      if(u > 0.86) blur = (u-0.86) * 40;
      else if(u < 0.22) blur = (0.22-u) * 12;

      /* 字号 */
      var fs = it.fontSize * s;

      /* 颜色 */
      var col;
      if(it.emphasis){
        col = COLORS.emp;
      } else {
        var ci = Math.min(2, Math.floor(u*3));
        col = COLORS.light[ci];
      }

      /* 方向拖尾（高速运动残影）*/
      if(u > 0.7 && u < 1 && s > 1.2){
        var tx = rx2*s*0.04, ty = ry2*s*0.04;
        ctx.save();
        for(var g=6; g>=1; g--){
          ctx.globalAlpha = op * centralDim * 0.12 * (6-g+1)/6;
          ctx.font = '700 '+fs+'px "Microsoft YaHei","SimHei",sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillStyle = col;
          ctx.fillText(it.text, px-tx*g, py-ty*g);
        }
        ctx.restore();
      }

      /* 主文字 */
      ctx.save();
      ctx.globalAlpha = op * centralDim;
      if(blur > 0){
        ctx.filter = 'blur('+blur.toFixed(1)+'px)';
      }
      ctx.font = '700 '+fs+'px "Microsoft YaHei","SimHei",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      /* 发光 */
      ctx.shadowColor = col;
      ctx.shadowBlur = it.emphasis ? 20 : 8;
      ctx.fillStyle = col;
      ctx.fillText(it.text, px, py);
      ctx.restore();
    });

    /* --- 暗角 --- */
    drawVignette();
  }

  /* =============================================================
     「国产淡水三文鱼」七字常驻屏幕中央：
     隧道阶段半透明垫底 → 结尾原位错峰点亮（无飞行、无粒子）
     ============================================================= */
  var FINAL_CHARS = [
    {t:'国', c:'#ff5252', glow:'#ff8a80'},
    {t:'产', c:'#ff6a3c', glow:'#ff9a6a'},
    {t:'淡', c:'#ff8a3c', glow:'#ffb26a'},
    {t:'水', c:'#ffab3c', glow:'#ffd194'},
    {t:'三', c:'#ffc93c', glow:'#ffe08a'},
    {t:'文', c:'#ffab3c', glow:'#ffd194'},
    {t:'鱼', c:'#ff6a3c', glow:'#ff9a6a'},
  ];
  var ARRIVE_ALL = (FINAL_CHARS.length-1)*0.12 + 0.45;

  var FONT = '"Microsoft YaHei","PingFang SC","SimHei",sans-serif';

  /* 七字弧形布局（自适应字距：中间略高、中字最大）*/
  function charLayout(i, cx, cy, minDim){
    var total = FINAL_CHARS.length;
    var fsBase = minDim * (total <= 5 ? 0.13 : 0.105);
    var slotBase = (minDim*0.88 - fsBase) / (total-1);
    var arcOffset = Math.sin((i/(total-1) - 0.5) * Math.PI) * minDim * (total <= 5 ? 0.03 : 0.025);
    var mid = Math.floor(total/2);
    var startX = cx - (total-1)*slotBase/2;
    var dist = Math.abs(i - mid);
    return {
      x: startX + i*slotBase,
      y: cy - arcOffset,
      sizeMult: (dist===0) ? 1.12 : (dist===1 ? 1.0 : 0.9)
    };
  }

  /* 隧道阶段：七字半透明常驻中央（呼吸）*/
  function drawCenterTitle(alpha){
    var cx = W/2, cy = H/2;
    var minDim = Math.min(W,H);
    FINAL_CHARS.forEach(function(ch, i){
      var pos = charLayout(i, cx, cy, minDim);
      var fs = minDim * 0.105 * pos.sizeMult;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.font = 'bold '+fs+'px '+FONT;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowColor = ch.glow; ctx.shadowBlur = 16;
      ctx.fillStyle = ch.c;
      ctx.fillText(ch.t, pos.x, pos.y);
      ctx.restore();
    });
  }

  function drawFinalGather(t, tStart){
    var dt = t - tStart;
    if(dt < 0 || dt > 2.5) return;
    var cx = W/2, cy = H/2;
    var minDim = Math.min(W,H);

    /* 隧道快速淡出（前 0.4s）*/
    var tunnelFade = Math.max(0, 1 - dt/0.4);
    if(tunnelFade > 0){
      ctx.save();
      ctx.globalAlpha = tunnelFade * 0.6;
      frame(t - dt*0.5);
      ctx.restore();
    }

    /* 七字原位错峰点亮（原位弹跳 + 从垫底透明度点亮，无飞行无粒子）*/
    FINAL_CHARS.forEach(function(ch, i){
      var pos = charLayout(i, cx, cy, minDim);
      var delay = i * 0.12;
      var popDur = 0.45;
      var sincePop = Math.max(0, dt - delay);
      var p = Math.min(sincePop/popDur, 1);

      /* scale 弹跳：0.6 → 过冲 1.16 → 回落 1.0 */
      var scale;
      if(p < 0.55){
        var q1 = p/0.55;
        scale = 0.6 + 0.56 * (1 - Math.pow(1-q1, 3));
      } else {
        var q2 = (p-0.55)/0.45;
        scale = 1.16 - 0.16 * (q2*q2*(3-2*q2));
      }

      /* 透明度：垫底 0.35 → 1 */
      var alpha = 0.35 + 0.65 * p;

      /* 光晕：点亮瞬间强脉冲，之后柔和呼吸 */
      var glowBlur = 18 + Math.max(0, 0.45 - sincePop) * 80 + Math.sin(t*3 + i)*4;

      var fs = minDim * 0.105 * pos.sizeMult * scale;

      ctx.save();
      ctx.font = 'bold '+fs+'px '+FONT;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      /* 外层光晕 */
      ctx.globalAlpha = alpha * 0.35;
      ctx.fillStyle = ch.glow;
      ctx.shadowColor = ch.glow; ctx.shadowBlur = glowBlur;
      ctx.fillText(ch.t, pos.x, pos.y);
      /* 主文字 */
      ctx.globalAlpha = alpha;
      ctx.fillStyle = ch.c;
      ctx.shadowBlur = glowBlur * 0.5;
      ctx.fillText(ch.t, pos.x, pos.y);
      /* 白色内核 */
      ctx.globalAlpha = alpha * 0.55;
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = ch.c; ctx.shadowBlur = 10;
      ctx.fillText(ch.t, pos.x, pos.y);
      ctx.restore();
    });

    /* 全部点亮后：冲击波环 + 双副标题 */
    var allArrived = dt > ARRIVE_ALL;
    if(allArrived){
      var sinceAll = dt - ARRIVE_ALL;

      /* 冲击波光环（多环，随节奏扩散）*/
      for(var er=0; er<4; er++){
        var ep = (sinceAll + er*0.15) % 1.0;
        var eRadius = ep * minDim * 0.5;
        ctx.save();
        ctx.globalAlpha = (1 - ep) * 0.25;
        ctx.strokeStyle = ['#ff5252','#ff8a5c','#ffc93c','#ffd194'][er];
        ctx.lineWidth = 3 - er*0.5;
        ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 15;
        ctx.beginPath(); ctx.arc(cx, cy, eRadius, 0, 7); ctx.stroke();
        ctx.restore();
      }

      /* 底部标语 */
      if(sinceAll > 0.2){
        var subP = Math.min((sinceAll-0.2)/0.4, 1);
        ctx.save();
        ctx.globalAlpha = subP * 0.85;
        ctx.font = minDim*0.028+'px Arial,sans-serif';
        ctx.fillStyle = '#ff6a4d';
        ctx.shadowColor = '#ff6a4d'; ctx.shadowBlur = 12;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('R A I N B O W   T R O U T   ·   N O T   S A L M O N', cx, cy + minDim*0.12);
        ctx.restore();
      }

      /* 顶部副标题 */
      if(sinceAll > 0.4){
        var topP = Math.min((sinceAll-0.4)/0.4, 1);
        ctx.save();
        ctx.globalAlpha = topP * 0.7;
        ctx.font = 'bold '+minDim*0.025+'px "Microsoft YaHei",sans-serif';
        ctx.fillStyle = '#ffb26a';
        ctx.shadowColor = '#ff6a4d'; ctx.shadowBlur = 10;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('— 淡水鱼 · 不生吃 · 必须熟食 —', cx, cy - minDim*0.12);
        ctx.restore();
      }
    }
  }

  /* ----- 主循环 ----- */
  var FINAL_DURATION = 2.5;
  var startGlobal = performance.now()/1000;

  function loop(now){
    var t = (now/1000 - startGlobal);
    var cycleT = t % (DUR + FINAL_DURATION);  /* 6秒隧道 + 2.5秒汇聚 */

    if(cycleT < DUR){
      /* 隧道阶段：七字常驻中央半透明垫底 + 呼吸 */
      frame(cycleT);
      drawCenterTitle(0.32 + Math.sin(cycleT/1.5 * 2*Math.PI)*0.06);
    } else {
      /* 汇聚阶段：七字原位错峰点亮 */
      var ft = cycleT - DUR;
      drawFinalGather(t, t - ft);
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
