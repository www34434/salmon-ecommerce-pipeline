<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>サーモン鮮切 · 雨夜街角</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b0e1a;touch-action:none}
  #c{display:block;width:100%;height:100%}
  #load{position:fixed;inset:0;background:#0b0e1a;z-index:9;transition:opacity 1s;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="load"></div>
<script src="libs/three.min.js"></script>
<script src="libs/OrbitControls.js"></script>
<script>
/* ============================================================
   三文鱼鲜切店 · 雨夜街角 微缩模型（三渲二 / 日式二次元夜景）
   无 UI · 自由拖拽旋转缩放 · 正方形底座
   ============================================================ */
var canvas = document.getElementById('c');
var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e1a);
/* 移轴景深：前景后景雾化 */
scene.fog = new THREE.Fog(0x0b0e1a, 14, 38);

var camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 120);
camera.position.set(8.8, 6.8, 10.2);

var controls = new THREE.OrbitControls(camera, canvas);
controls.target.set(0, 1.35, 0);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 4.5; controls.maxDistance = 24;
controls.maxPolarAngle = Math.PI * 0.495;
controls.autoRotate = true; controls.autoRotateSpeed = 0.65;
var idleTimer = null;
controls.addEventListener('start', function(){ controls.autoRotate = false; clearTimeout(idleTimer); });
controls.addEventListener('end', function(){ idleTimer = setTimeout(function(){ controls.autoRotate = true; }, 4000); });

/* ---------- 三渲二：卡通色阶 + 描边 ---------- */
var gradData = new Uint8Array([95, 150, 215, 255]);
var gradientMap = new THREE.DataTexture(gradData, 4, 1, THREE.LuminanceFormat);
gradientMap.minFilter = gradientMap.magFilter = THREE.NearestFilter;
gradientMap.needsUpdate = true;

function M(color, opt){ // toon 材质
  var o = opt || {}; o.color = color; o.gradientMap = gradientMap;
  return new THREE.MeshToonMaterial(o);
}
function GLOW(color, opt){ // 自发光（灯箱/霓虹/屏幕）
  return new THREE.MeshBasicMaterial(Object.assign({color:color}, opt||{}));
}
function addEdges(mesh, op, th){
  var e = new THREE.LineSegments(
    new THREE.EdgesGeometry(mesh.geometry, th||28),
    new THREE.LineBasicMaterial({color:0x0a0c18, transparent:true, opacity:(op===undefined?0.30:op)})
  );
  mesh.add(e); return mesh;
}
function shadowPad(x, z, r, op){ // 假阴影（夜景不开实时阴影，垫半透明圆片）
  var p = new THREE.Mesh(new THREE.CircleGeometry(r, 20),
    new THREE.MeshBasicMaterial({color:0x05060d, transparent:true, opacity:(op||0.4), depthWrite:false}));
  p.rotation.x = -Math.PI/2; p.position.set(x, 0.012, z); scene.add(p); return p;
}
function B(w,h,d,mat,x,y,z,edge){ // box 快捷
  var m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); scene.add(m);
  if(edge!==false) addEdges(m);
  return m;
}
function C(rt,rb,h,seg,mat,x,y,z,edge){ // cylinder 快捷
  var m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.position.set(x,y,z); scene.add(m);
  if(edge) addEdges(m, edge);
  return m;
}

/* ---------- 文字贴图（店招 / 海报 / 路牌）---------- */
function textTex(w, h, draw){
  var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  var ctx = cv.getContext('2d'); draw(ctx, w, h);
  var t = new THREE.CanvasTexture(cv); t.anisotropy = 4; return t;
}

/* ============================================================
   ① 底座与地面
   ============================================================ */
B(10, 0.5, 10, M(0x232842), 0, -0.25, 0, 0.5);                    // 底座体
var baseTop = new THREE.Mesh(new THREE.BoxGeometry(10.04,0.06,10.04), M(0x2c3352));
baseTop.position.y = 0.03; scene.add(baseTop);
/* 切角边框（45° 斜切亮边）*/
function bevelEdge(x,z,w,d,rot){
  var m = new THREE.Mesh(new THREE.BoxGeometry(w,0.08,d), GLOW(0x4a78ff,{transparent:true,opacity:0.7}));
  m.position.set(x,0.045,z); m.rotation.y = rot; scene.add(m);
}
bevelEdge(0,5.02,10.2,0.12,0);          // 前
bevelEdge(0,-5.02,10.2,0.12,0);         // 后
bevelEdge(5.02,0,0.12,10.2,0);          // 右
bevelEdge(-5.02,0,0.12,10.2,0);        // 左
[[5,5],[5,-5],[-5,5],[-5,-5]].forEach(function(c){ // 四角斜切
  var ce = new THREE.Mesh(new THREE.BoxGeometry(0.18,0.08,0.18), GLOW(0x6d9aff,{transparent:true,opacity:0.85}));
  ce.position.set(c[0],0.045,c[1]); ce.rotation.y = Math.PI/4; scene.add(ce);
});
var ground = new THREE.Mesh(new THREE.PlaneGeometry(10,10),
  new THREE.MeshPhongMaterial({color:0x2a3150, shininess:140, specular:0xa8c0ff})); // 湿柏油高反光
ground.rotation.x = -Math.PI/2; ground.position.y = 0.065; scene.add(ground);

/* 人行道区（浅灰石板）*/
var walk = new THREE.Mesh(new THREE.BoxGeometry(10,0.05,1.5), M(0x6b7089));
walk.position.set(0,0.085,-0.1); scene.add(walk); addEdges(walk,0.2);

/* 车行道与转弯路缘 */
var roadLine = new THREE.Mesh(new THREE.BoxGeometry(10,0.02,0.06), M(0xd9dce8,{emissive:0x22263a}));
roadLine.position.set(0,0.072,0.66); scene.add(roadLine);
var curb = B(0.12,0.1,5.2, M(0x565d7c), 4.94,0.1,2.9, 0.25); // 右转角路缘
var curb2 = B(5.2,0.1,0.12, M(0x565d7c), 2.2,0.1,0.72, 0.25);    // 前路缘

/* 反光斑马线（过街）*/
for(var i=0;i<6;i++){
  var zeb = new THREE.Mesh(new THREE.BoxGeometry(0.55,0.015,0.16),
    new THREE.MeshPhongMaterial({color:0xdde3f2, shininess:160, specular:0xffffff}));
  zeb.position.set(-3.2+i*1.06, 0.078, 2.1); scene.add(zeb);
}
/* 停车位划线（右侧）*/
B(0.05,0.012,1.6, GLOW(0xcfd6ea,{transparent:true,opacity:0.75}), 2.6,0.075,3.6, false);
B(0.05,0.012,1.6, GLOW(0xcfd6ea,{transparent:true,opacity:0.75}), 4.1,0.075,3.6, false);
/* 排水沟（人行道外缘细槽）*/
B(9.6,0.02,0.14, M(0x1c2033), 0,0.075,0.62, false);

/* 积水水洼（雨夜反光）+ 拉长霓虹倒影 */
[[1.6,1.4,0.85],[-2.2,2.6,0.7],[3.3,1.1,0.55],[-1.2,0.3,0.5],[0.6,3.4,0.65]].forEach(function(p,i){
  var pud = new THREE.Mesh(new THREE.CircleGeometry(p[2], 22),
    new THREE.MeshPhongMaterial({color:0x131a30, shininess:200, specular:0xbfd2ff, transparent:true, opacity:0.92}));
  pud.rotation.x = -Math.PI/2; pud.position.set(p[0], 0.072+i*0.002, p[1]);
  pud.scale.x = 1.35; scene.add(pud);
});
/* 拉长霓虹光斑（地面倒映招牌）*/
var reflStreak = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 0.08),
  new THREE.MeshBasicMaterial({color:0x4d8dff, transparent:true, opacity:0.55, blending:THREE.AdditiveBlending, depthWrite:false}));
reflStreak.rotation.x = -Math.PI/2; reflStreak.position.set(-0.25,0.078,1.2);
reflStreak.scale.set(1, 6, 1); scene.add(reflStreak);
var reflStreak2 = new THREE.Mesh(new THREE.PlaneGeometry(0.08, 2),
  new THREE.MeshBasicMaterial({color:0xff7a3c, transparent:true, opacity:0.35, blending:THREE.AdditiveBlending, depthWrite:false}));
reflStreak2.rotation.x = -Math.PI/2; reflStreak2.position.set(0.6,0.079,0.6);
reflStreak2.scale.set(1, 4, 1); scene.add(reflStreak2);
var reflLamp = new THREE.Mesh(new THREE.PlaneGeometry(0.04, 1.4),
  new THREE.MeshBasicMaterial({color:0xffe8b8, transparent:true, opacity:0.55, blending:THREE.AdditiveBlending, depthWrite:false}));
reflLamp.rotation.x = -Math.PI/2; reflLamp.position.set(-2.9,0.08,0.15);
reflLamp.scale.set(1, 6, 1); scene.add(reflLamp);

/* ============================================================
   ② 三文鱼鲜切店（视觉中心）
   ============================================================ */
var WALL = M(0xe9dfcd), WALL2 = M(0xdcd2be);
/* 墙体（左/右/后）*/
B(0.16,3,4, WALL, -2.52,1.5,-2.8);
B(0.16,3,4, WALL,  2.52,1.5,-2.8);
B(5.2,3,0.16, WALL2, 0,1.5,-4.72);
/* 店顶 + 屋檐 */
B(5.7,0.22,4.5, M(0x3d4257), 0,3.1,-2.8);
B(5.9,0.1,0.5, M(0x2e3346), 0,3.02,-0.72); // 前檐
/* 正面：墙裙 + 楣 + 大玻璃窗 */
B(5.2,0.5,0.14, WALL, 0,0.25,-0.78);
B(5.2,0.55,0.14, WALL, 0,2.72,-0.78);
var GLASS = new THREE.MeshPhongMaterial({color:0xa8d8ff, transparent:true, opacity:0.14, shininess:180, specular:0xffffff});
/* 玻璃雨滴痕迹贴图（动态滑落）*/
var raindropTex = textTex(512, 512, function(ctx,w,h){
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = 'rgba(180,220,255,.18)';
  for(var i=0;i<60;i++){
    var rx = Math.random()*w, ry = Math.random()*h, rr = 2+Math.random()*5;
    ctx.beginPath(); ctx.arc(rx,ry,rr,0,7); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(200,230,255,.35)'; ctx.lineWidth = 1.5;
  for(var j=0;j<35;j++){
    var sx = Math.random()*w, sy = Math.random()*h;
    ctx.beginPath(); ctx.moveTo(sx,sy);
    ctx.lineTo(sx+Math.random()*3-1, sy+10+Math.random()*25); ctx.stroke();
  }
});
var glassMatFront = new THREE.MeshPhongMaterial({
  color:0xa8d8ff, transparent:true, opacity:0.16, shininess:200, specular:0xffffff,
  map:raindropTex});
var glassF = new THREE.Mesh(new THREE.BoxGeometry(5.0,2.1,0.05), glassMatFront);
glassF.position.set(0,1.55,-0.76); scene.add(glassF); addEdges(glassF,0.4);
var glassR = new THREE.Mesh(new THREE.BoxGeometry(0.05,1.9,2.6), glassMatFront.clone());
glassR.material.opacity = 0.18; glassR.position.set(2.55,1.5,-1.9); scene.add(glassR); addEdges(glassR,0.4);
/* 玻璃竖框 */
[-1.7,0,1.7].forEach(function(x){ B(0.07,2.15,0.09, M(0x8a8272), x,1.55,-0.74, false); });
/* 自动门（右侧开合缝 + 门轨）*/
B(1.1,2.05,0.06, GLASS.clone(), 1.05,1.27,-0.74, false).material.opacity = 0.22;
B(1.18,0.08,0.12, M(0x8a8272), 1.05,2.32,-0.74, false);
/* 门口地垫 */
var mat2 = new THREE.Mesh(new THREE.BoxGeometry(1.5,0.03,0.75), M(0x2f6b52));
mat2.position.set(1.05,0.105,-0.35); scene.add(mat2); addEdges(mat2,0.3);

/* 「鱼」字主视觉立牌（店旁灯箱）*/
function salmonSlice(ctx,x,y,s,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(s,s);
  var g2 = ctx.createLinearGradient(-45,-35,45,35);
  g2.addColorStop(0,'#ffb26a'); g2.addColorStop(0.5,'#ff7a3c'); g2.addColorStop(1,'#e8512a');
  ctx.fillStyle = g2;
  ctx.beginPath();
  ctx.moveTo(-52,6);
  ctx.quadraticCurveTo(-30,-42,18,-34);
  ctx.quadraticCurveTo(58,-24,50,10);
  ctx.quadraticCurveTo(40,40,-6,36);
  ctx.quadraticCurveTo(-44,32,-52,6);
  ctx.closePath(); ctx.fill();
  /* 脂肪白纹（三文鱼刺身标志性）*/
  ctx.strokeStyle = 'rgba(255,250,240,.82)'; ctx.lineCap = 'round';
  [[-38,-20,-12,4,2,14,4.5],[-20,-30,2,8,18,22,4],[-2,-32,16,-2,30,14,3.8],
   [14,-26,28,0,40,12,3.4],[-44,-6,-22,10,-4,22,3.6],[-30,12,-10,24,10,30,3.2]].forEach(function(st){
    ctx.lineWidth = st[6];
    ctx.beginPath(); ctx.moveTo(st[0],st[1]);
    ctx.quadraticCurveTo(st[2],st[3],st[4],st[5]); ctx.stroke();
  });
  /* 高光反光 + 油脂光泽 */
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(-28,-18); ctx.quadraticCurveTo(-8,-8,8,-4); ctx.stroke();
  /* 油脂光泽（更亮的小斑点）*/
  ctx.fillStyle = 'rgba(255,255,255,.7)';
  [[-22,-12,2],[8,-6,1.8],[24,4,1.5],[-14,18,1.6]].forEach(function(sp){
    ctx.beginPath(); ctx.arc(sp[0],sp[1],sp[2],0,7); ctx.fill();
  });
  ctx.restore();
}
var boardTex = textTex(512, 1024, function(ctx,w,h){
  var bg = ctx.createLinearGradient(0,0,0,h);
  bg.addColorStop(0,'#0d2f74'); bg.addColorStop(.55,'#1b57b8'); bg.addColorStop(1,'#0a2456');
  ctx.fillStyle = bg; ctx.fillRect(0,0,w,h);
  for(var i=0;i<26;i++){
    ctx.fillStyle = 'rgba(255,255,255,'+(0.02+Math.random()*0.05).toFixed(3)+')';
    ctx.fillRect(Math.random()*w, 0, 2+Math.random()*10, h);
  }
  ctx.fillStyle = '#eaf4ff'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold 34px "Microsoft YaHei",sans-serif';
  ctx.fillText('好品东方', 36, 76);
  ctx.fillText('以鱼会友', 36, 120);
  ctx.textAlign = 'right';
  ctx.font = 'bold 42px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('蓝塞夫', w-36, 82);
  ctx.font = '20px Arial'; ctx.fillStyle = 'rgba(255,255,255,.8)';
  ctx.fillText('Blue Sea Food', w-36, 112);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  /* 磨砂内发光：多层模糊光晕 */
  ctx.font = '900 420px "STXingkai","华文行楷","KaiTi","STKaiti","SimHei",serif';
  ctx.fillStyle = 'rgba(120,180,255,.18)'; ctx.shadowColor = '#4d8dff'; ctx.shadowBlur = 60;
  ctx.fillText('鱼', w/2, 448);
  ctx.fillStyle = 'rgba(180,220,255,.3)'; ctx.shadowBlur = 36;
  ctx.fillText('鱼', w/2, 448);
  ctx.fillStyle = '#f6fbff'; ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 16;
  ctx.fillText('鱼', w/2, 448);
  /* 磨砂颗粒（噪点）*/
  ctx.shadowBlur = 0;
  for(var fr=0; fr<400; fr++){
    ctx.fillStyle = 'rgba(255,255,255,'+(Math.random()*0.06).toFixed(3)+')';
    ctx.fillRect(Math.random()*w, 220+Math.random()*460, 2, 2);
  }
  salmonSlice(ctx,112,842,1.0,-0.10);
  salmonSlice(ctx,226,854,0.94,0.06);
  salmonSlice(ctx,338,846,1.02,-0.04);
  salmonSlice(ctx,440,858,0.9,0.10);
  ctx.textBaseline = 'alphabetic'; ctx.font = '20px Arial';
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.fillText('B L U E   S E A   F O O D', w/2, h-34);
});
var sb = new THREE.Group(); sb.position.set(-2.78,0.1,-0.02); sb.rotation.y = 0.34; scene.add(sb);
/* 透明亚克力外壳（前后面板）*/
var acrylMat = new THREE.MeshPhongMaterial({
  color:0x8fbaff, transparent:true, opacity:0.18, shininess:120, specular:0xbfd8ff, depthWrite:false});
var acrylFront = new THREE.Mesh(new THREE.BoxGeometry(0.72,1.68,0.02), acrylMat);
acrylFront.position.set(0,1.0,0.05); sb.add(acrylFront);
var acrylBack = new THREE.Mesh(new THREE.BoxGeometry(0.72,1.68,0.02), acrylMat.clone());
acrylBack.position.set(0,1.0,-0.05); acrylBack.material.opacity = 0.12; sb.add(acrylBack);
/* 亚克力侧条（淡蓝发光边缘）*/
[[0.36,0,1.0,0.1],[0.36,0,1.0,-0.1],[-0.02,1.84,0.76,0],[-0.02,0.16,0.76,0]].forEach(function(s){
  var edge = new THREE.Mesh(new THREE.BoxGeometry(s[2],s[3]?s[3]:0.02, s[3]?0.02:s[3]),
    GLOW(0xbfd8ff,{transparent:true,opacity:0.85}));
  edge.position.set(s[0],s[1],s[3]||s[2]); sb.add(edge);
});
/* 内部灯箱背板（反光白）*/
var sbBack = new THREE.Mesh(new THREE.BoxGeometry(0.64,1.56,0.03), M(0xf0f4ff));
sbBack.position.set(0,1.0,-0.042); sb.add(sbBack);
var sbFace = new THREE.Mesh(new THREE.PlaneGeometry(0.6,1.5), new THREE.MeshBasicMaterial({map:boardTex}));
sbFace.position.set(0,1.02,0.032); sb.add(sbFace);
[[0,1.83,0.64,0.03],[0,0.2,0.64,0.03],[-0.325,1.01,0.03,1.56],[0.325,1.01,0.03,1.56]].forEach(function(f){
  var fr = new THREE.Mesh(new THREE.BoxGeometry(f[2],f[3],0.02), GLOW(0xcfe4ff,{transparent:true,opacity:0.75}));
  fr.position.set(f[0],f[1],0.03); sb.add(fr);
});
[[-0.2],[0.2]].forEach(function(p){
  var leg = new THREE.Mesh(new THREE.CylinderGeometry(0.024,0.024,0.42,8), M(0x39405a));
  leg.position.set(p[0],0.21,0); sb.add(leg);
  var foot = new THREE.Mesh(new THREE.BoxGeometry(0.16,0.03,0.16), M(0x2a2f45));
  foot.position.set(p[0],0.015,0); sb.add(foot);
});
var sbTop = new THREE.Mesh(new THREE.BoxGeometry(0.72,0.05,0.1), M(0x2a2f45));
sbTop.position.set(0,1.85,0); sb.add(sbTop); addEdges(sbTop,0.4);
shadowPad(-2.6,0.2,0.55,0.35);
var sbLight = new THREE.PointLight(0xbfd8ff, 0.65, 2.6); sbLight.position.set(-2.5,1.95,0.5); scene.add(sbLight);

/* 営業中 霓虹小灯牌（门侧）*/
var openTex = textTex(128, 384, function(ctx,w,h){
  ctx.fillStyle = '#101423'; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = '#ff5d5d'; ctx.lineWidth = 6; ctx.shadowColor = '#ff5d5d'; ctx.shadowBlur = 16;
  ctx.strokeRect(10,10,w-20,h-20);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 74px "Yu Gothic","Hiragino Sans","Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#ffdada'; ctx.shadowColor = '#ff5d5d'; ctx.shadowBlur = 24;
  ctx.fillText('営', w/2, 76);
  ctx.fillText('業', w/2, 192);
  ctx.fillText('中', w/2, 308);
});
var openSign = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.84,0.06),
  [M(0x101423),M(0x101423),M(0x101423),M(0x101423),new THREE.MeshBasicMaterial({map:openTex}),M(0x101423)]);
openSign.position.set(2.32,2.0,-0.66); scene.add(openSign); addEdges(openSign,0.4);
var openLight = new THREE.PointLight(0xff6b6b, 0.55, 2.2); openLight.position.set(2.32,2.0,-0.3); scene.add(openLight);

/* 店内精细化：冰柜价签灯条 / 吊挂菜单 / 顶棚管线 / 挂钟 */
B(2.3,0.05,0.02, GLOW(0xfff3d2), -1.25,1.06,-3.66, false);
var menuTex = textTex(512, 288, function(ctx,w,h){
  ctx.fillStyle = '#151d36'; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = 'rgba(140,190,255,.6)'; ctx.lineWidth = 4; ctx.strokeRect(8,8,w-16,h-16);
  ctx.fillStyle = '#8be9ff'; ctx.font = 'bold 44px "Yu Gothic","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center'; ctx.fillText('本日のおすすめ', w/2, 62);
  ctx.font = '30px "Microsoft YaHei",sans-serif'; ctx.fillStyle = '#f2f6ff';
  [['盐烤三文鱼排 ¥32',120],['虹鳟亲子丼 ¥28',178],['三文鱼茶泡饭 ¥24',236]].forEach(function(it){
    ctx.textAlign = 'left';  ctx.fillText(it[0], 44, it[1]);
    ctx.textAlign = 'right'; ctx.fillText('●', w-44, it[1]);

/* 店招「从头吃到尾」· 日式霓虹立体招牌 */
function fishNeon(ctx, cx, cy, len, hh){
  ctx.save(); ctx.translate(cx, cy);
  var L = len/2;
  /* 点阵式发光鱼鳞（LED 点阵）*/
  var dotColors = ['#4d8dff','#6dafff','#3f74ff','#8bc4ff'];
  for(var row=-3; row<=3; row++){
    for(var col=-10; col<=8; col++){
      var sx = col*14 + Math.abs(row)*3;
      var sy = row*11 + (col%2===0?0:5);
      var yLimit = hh*0.82 - Math.abs(row)*4;
      if(Math.abs(sx)>L*0.85 || Math.abs(sy)>yLimit) continue;
      ctx.fillStyle = dotColors[(row+col)%4];
      ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(sx, sy, 2.8, 0, 7); ctx.fill();
    }
  }
  /* 多层 LED 描边（3 层外发光）*/
  var ledLayers = [
    {color:'rgba(77,141,255,.35)', width:14, blur:28},
    {color:'rgba(140,190,255,.7)',  width:9,  blur:18},
    {color:'#a8d4ff',               width:5,  blur:10},
    {color:'#ffffff',               width:2,  blur:0}
  ];
  ledLayers.forEach(function(ly){
    ctx.strokeStyle = ly.color; ctx.lineWidth = ly.width;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.shadowColor = '#4d8dff'; ctx.shadowBlur = ly.blur;
    ctx.beginPath();
    ctx.moveTo(-L+6, -2);
    ctx.quadraticCurveTo(-L*0.42, -hh, L*0.34, -hh*0.52);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-L+6, -2);
    ctx.quadraticCurveTo(-L*0.38, hh*1.04, L*0.3, hh*0.56);
    ctx.stroke();
    ctx.beginPath();                                  /* 鱼尾三撇 */
    ctx.moveTo(L*0.32, -hh*0.5);
    ctx.quadraticCurveTo(L*0.72, -hh*1.1, L+16, -hh*0.92);
    ctx.moveTo(L*0.32, hh*0.54);
    ctx.quadraticCurveTo(L*0.7, hh*1.1, L+16, hh*0.92);
    ctx.moveTo(L*0.34, 0);
    ctx.lineTo(L+18, 0);
    ctx.stroke();
  });
  /* 鱼鳃线 */
  ctx.shadowBlur = 8; ctx.strokeStyle = '#a8d4ff'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-L+52, -hh*0.42);
  ctx.quadraticCurveTo(-L+30, 0, -L+52, hh*0.44);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(-L+78, 4, 7, 0, 7); ctx.stroke();  /* 鱼眼 */
  ctx.restore();
}

  var curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(a[0],a[1],a[2]),
    new THREE.Vector3((a[0]+b[0])/2,(a[1]+b[1])/2-sag,(a[2]+b[2])/2),
    new THREE.Vector3(b[0],b[1],b[2])
  ]);
  var tube = new THREE.Mesh(new THREE.TubeGeometry(curve,16,0.014,6), M(0x14161f));
  scene.add(tube);
}

/* ============================================================
   ⑥ 雨（LineSegments 短竖线 · 日式动画雨感）
   ============================================================ */
var RAIN_N = 420;
var rainPos = new Float32Array(RAIN_N*6);
var rainSpd = new Float32Array(RAIN_N);
for(var ri=0;ri<RAIN_N;ri++){
  var rx = (Math.random()-0.5)*11, ry = Math.random()*9, rz = (Math.random()-0.5)*11;
  rainPos.set([rx,ry,rz, rx,ry-0.32,rz], ri*6);
  rainSpd[ri] = 0.10 + Math.random()*0.09;
}
var rainGeo = new THREE.BufferGeometry();
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
var rain = new THREE.LineSegments(rainGeo,
  new THREE.LineBasicMaterial({color:0x9db4e8, transparent:true, opacity:0.32}));
scene.add(rain);

/* ============================================================
   ⑦ 动画循环
   ============================================================ */
var clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  var t = clock.getElapsedTime();
  /* 雨 */
  var arr = rainGeo.attributes.position.array;
  for(var i=0;i<RAIN_N;i++){
    var dy = rainSpd[i];
    arr[i*6+1] -= dy; arr[i*6+4] -= dy;
    if(arr[i*6+4] < 0.05){
      var ny = 7.5 + Math.random()*2;
      arr[i*6+1] = ny; arr[i*6+4] = ny-0.32;
    }
  }
  rainGeo.attributes.position.needsUpdate = true;
  /* 霓虹呼吸闪烁（蓝）*/
  neonLight.intensity = 1.15 + Math.sin(t*2.4)*0.14 + (Math.random()<0.012 ? -0.75 : 0);
  var signFlick = Math.random() < 0.015;
  trimT.material.color.setHex(signFlick ? 0x182c5c : 0x4d8dff);
  trimB.material.color.setHex(signFlick ? 0x182c5c : 0x4d8dff);
  vmPanel.material.color.setHex(Math.random()<0.008 ? 0x8fb6cf : 0xcfeaff);
  /* 全息水波纹扩散 */
  rippleGroup.children.forEach(function(ring){
    var p = (t*0.4 + ring.userData.phase*0.6) % 1.8;
    ring.scale.set(1+p*0.3, 1+p*0.3, 1);
    ring.material.opacity = (0.18-ring.userData.phase*0.04) * (1-p/1.8);
  });
  /* 气泡漂浮 */
  bubbleData.forEach(function(b){
    b.position.y = b.userData.baseY + Math.sin(t*b.userData.speed + b.userData.phase)*0.12;
    b.position.x += Math.sin(t*0.7+b.userData.phase)*0.002;
    b.material.opacity = 0.55 + Math.sin(t*2+b.userData.phase)*0.2;
  });
  /* 雨滴贴图缓慢下移 */
  if(glassF.material.map){
    glassF.material.map.offset.y -= 0.0008;
    if(glassF.material.map.offset.y < -1) glassF.material.map.offset.y = 0;
  }
  /* 鱼游动 */
  koi.position.x = 2.02 + Math.sin(t*1.3)*0.14;
  koi.position.z = -1.32 + Math.cos(t*0.9)*0.07;
  koi.rotation.y = -t*1.3;
  controls.update();
  renderer.render(scene, camera);
}
tick();

});
