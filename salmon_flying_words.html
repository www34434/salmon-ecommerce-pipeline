<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>深海三文鱼 · Flying Words Tunnel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#060812}
canvas{display:block;position:absolute;top:0;left:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ================================================================
   Flying Words Tunnel — 深海三文鱼主题
   按 spec card: 22词黄金角铺位 + z轴透视推进 + 生命曲线 + 擦身而过
   6秒2循环无缝 → 最后汇聚"深海三文鱼"
   ================================================================ */
(function(){
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W,H,P;
  function resize(){
    W = cv.width = window.innerWidth;
    H = cv.height = window.innerHeight;
    P = 4400;  /* perspective 原生值 */
  }
  resize(); window.addEventListener('resize', resize);

  /* ----- 三文鱼主题 22 词（4-7字，适配中文字宽 ----- */
  var WORDS = [
    '烟台虹鳟','刺身级新鲜','从头吃到尾','清爽美味','低卡美食',
    'Omega-3富含','高蛋白','冰鲜直送','液氮急冻','冷链直达',
    '鲜切现做','溯源可查','一口深海','黄海冷水团','北纬37度',
    '三文鱼','深海鱼','虹鳟鱼','鱼油精华','肉质细嫩',
    '入口即化','鲜美多汁'
  ];
  var EMPHASIS = [2,8,14,20];  /* 电光蓝强调词索引 */
  var COLORS = {
    light:  ['#f2f5ff','#c3cbe2','#8a95b5'],
    emp:    '#86a8ff',
    empGlow:'rgba(134,168,255,'
  };

  /* ----- 确定性伪随机 ----- */
  function rand(i){
    var x = Math.sin((i*9301+49297)*0.0001)*233280;
    return x - Math.floor(x);
  }

  /* ----- 词对象 ----- */
  var N = WORDS.length;
  var CYCLIC = 2;  /* 整数圈无缝循环 */
  var DUR = 6.0;   /* 秒 */

  var items = [];
  for(var i=0; i<N; i++){
    var a = i*2.39996 + rand(i*7+1)*0.8;     /* 黄金角 */
    var r = 330 + rand(i)*660;                 /* 半径 */
    items.push({
      text: WORDS[i],
      emphasis: EMPHASIS.indexOf(i)>=0,
      angle: a, r: r,
      yScale: 0.6,
      spawnZ: -7000, endZ: 3200,
      phase: i/N,                              /* 均分相位 */
      fontSize: 64 + rand(i+100)*56,          /* 64-120px */
      baseAlpha: 1.0
    });
  }

  /* ----- 生命曲线插值 ----- */
  var OT = [0, 0.25, 0.6, 0.85, 1];
  var OP = [0, 1, 0.5, 0.2, 0];
  function life(u){
    if(u<=0) return 0;
    if(u>=1) return 0;
    for(var k=0; k<4; k++){
      if(u>=OT[k] && u<=OT[k+1]){
        var p = (u-OT[k])/(OT[k+1]-OT[k]);
        return OP[k] + (OP[k+1]-OP[k])*p;
      }
    }
    return 0;
  }

  /* ----- 隧道壁发丝环 ----- */
  var hairRings = [];
  for(var k=0; k<10; k++){
    hairRings.push({
      baseR: 330 + k*66,
      phase: k/10,
      thickness: 1 + k*0.4
    });
  }

  /* ----- 尘埃流线 ----- */
  var dust = [];
  for(var d=0; d<56; d++){
    dust.push({
      angle: d*0.4 + rand(d*3)*0.6,
      r: 100 + rand(d+50)*800,
      zPhase: rand(d+200),
      speed: 0.8 + rand(d+300)*0.6,
      len: 40 + rand(d+400)*80
    });
  }

  /* ----- 中心光晕 ----- */
  function drawHalo(t){
    var pulse = 0.82 + Math.sin(t*4*Math.PI)*0.14;  /* 呼吸2次/6秒 */
    var cx = W/2, cy = H/2;
    var g = ctx.createRadialGradient(cx,cy,0, cx,cy, Math.min(W,H)*0.55);
    g.addColorStop(0, 'rgba(134,168,255,'+(0.28*pulse)+')');
    g.addColorStop(0.25, 'rgba(77,141,255,'+(0.12*pulse)+')');
    g.addColorStop(0.6, 'rgba(15,25,60,0.08)');
    g.addColorStop(1, 'rgba(6,8,18,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }

  /* ----- 暗角 ----- */
  function drawVignette(){
    var cx = W/2, cy = H/2;
    var g = ctx.createRadialGradient(cx,cy,Math.min(W,H)*0.25, cx,cy,Math.max(W,H)*0.7);
    g.addColorStop(0, 'rgba(6,8,18,0)');
    g.addColorStop(1, 'rgba(3,5,14,0.92)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }

  /* ----- 渲染一帧 ----- */
  function frame(t){
    var cx = W/2, cy = H/2;
    var DPR = Math.min(window.devicePixelRatio||1, 2);

    ctx.fillStyle = '#060812';
    ctx.fillRect(0,0,W,H);

    /* 隧道整体极缓滚转 ±2.5度 */
    var tunnelRot = Math.sin(t*2*Math.PI) * 2.5 * Math.PI/180;
    var cosR = Math.cos(tunnelRot), sinR = Math.sin(tunnelRot);

    /* --- 尘埃流线 --- */
    dust.forEach(function(d){
      var dz = ((t*0.15*d.speed + d.zPhase) % 1);
      /* dz: 0远→1近 */
      var z = -7000 + dz*10200;
      if(z < -6800 || z > 3000) return;
      var s = P/(P-z);
      var drift = 0.5 + dz*1.35;
      var rx = d.r * drift * Math.cos(d.angle);
      var ry = d.r * drift * Math.sin(d.angle) * 0.6;
      var px = cx + rx * s;
      var py = cy + ry * s;
      /* 方向拖尾：沿 -v 方向延长 */
      var vx = rx*s*0.02, vy = ry*s*0.02;
      ctx.save();
      ctx.globalAlpha = life(dz)*0.4;
      ctx.strokeStyle = '#86a8ff';
      ctx.lineWidth = Math.max(0.5, s*1.5);
      ctx.beginPath();
      ctx.moveTo(px-vx*d.len, py-vy*d.len);
      ctx.lineTo(px, py);
      ctx.stroke();
      ctx.restore();
    });

    /* --- 隧道壁发丝环 --- */
    hairRings.forEach(function(hr){
      var hz = ((t/DUR*CYCLIC + hr.phase) % 1);
      var z = -7000 + hz*10200;
      if(z < -6800 || z > 3000) return;
      var s = P/(P-z);
      var drift = 0.5 + hz*1.35;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(tunnelRot);
      ctx.globalAlpha = life(hz)*0.35;
      ctx.strokeStyle = '#4d8dff';
      ctx.lineWidth = Math.max(0.3, hr.thickness * s * 0.6);
      ctx.beginPath();
      /* 扁椭圆 */
      for(var a=0; a<Math.PI*2; a+=0.12){
        var ex = hr.baseR*drift*Math.cos(a) * s;
        var ey = hr.baseR*drift*Math.sin(a)*0.6 * s;
        if(a===0) ctx.moveTo(ex,ey); else ctx.lineTo(ex,ey);
      }
      ctx.stroke();
      ctx.restore();
    });

    /* --- 中心光晕 --- */
    drawHalo(t);

    /* --- 词语 --- */
    items.forEach(function(it){
      /* 时间推进：每个词按自己的 phase 起始，整圈重复 */
      var rawT = (t/DUR*CYCLIC + it.phase) % 1;
      var u = rawT;  /* 0远→1近 */

      var z = it.spawnZ + u*(it.endZ - it.spawnZ);
      var s = P/(P-z);
      var drift = 0.5 + u*1.35;

      var rx = it.r * drift * Math.cos(it.angle);
      var ry = it.r * drift * Math.sin(it.angle) * it.yScale;
      /* 隧道滚转 */
      var rx2 = rx*cosR - ry*sinR;
      var ry2 = rx*sinR + ry*cosR;

      var px = cx + rx2 * s;
      var py = cy + ry2 * s;

      /* 生命曲线 */
      var op = life(u);

      /* 近端糊化：u>0.86 起线性失焦 */
      var blur = 0;
      if(u > 0.86) blur = (u-0.86) * 40;
      else if(u < 0.22) blur = (0.22-u) * 12;

      /* 字号 */
      var fs = it.fontSize * s;

      /* 颜色 */
      var col;
      if(it.emphasis){
        col = COLORS.emp;
      } else {
        var ci = Math.min(2, Math.floor(u*3));
        col = COLORS.light[ci];
      }

      /* 方向拖尾（高速运动残影）*/
      if(u > 0.7 && u < 1 && s > 1.2){
        var tx = rx2*s*0.04, ty = ry2*s*0.04;
        ctx.save();
        for(var g=6; g>=1; g--){
          ctx.globalAlpha = op * 0.12 * (6-g+1)/6;
          ctx.font = '700 '+fs+'px "Microsoft YaHei","SimHei",sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillStyle = col;
          ctx.fillText(it.text, px-tx*g, py-ty*g);
        }
        ctx.restore();
      }

      /* 主文字 */
      ctx.save();
      ctx.globalAlpha = op;
      if(blur > 0){
        ctx.filter = 'blur('+blur.toFixed(1)+'px)';
      }
      ctx.font = '700 '+fs+'px "Microsoft YaHei","SimHei",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      /* 发光 */
      ctx.shadowColor = col;
      ctx.shadowBlur = it.emphasis ? 20 : 8;
      ctx.fillStyle = col;
      ctx.fillText(it.text, px, py);
      ctx.restore();
    });

    /* --- 暗角 --- */
    drawVignette();
  }

  /* =============================================================
     最后 0.5 秒：5 字从隧道中心汇聚成「深海三文鱼」
     ============================================================= */
  var FINAL_CHARS = [
    {t:'深', c:'#4d8dff', glow:'#86a8ff'},
    {t:'海', c:'#6db5ff', glow:'#8bc4ff'},
    {t:'三', c:'#ff7a3c', glow:'#ffb26a'},
    {t:'文', c:'#ffb26a', glow:'#ffd194'},
    {t:'鱼', c:'#a8d4ff', glow:'#c3e0ff'},
  ];

  /* 冲击波粒子（每个字到位时炸开）*/
  var burstParticles = [];

  function drawFinalGather(t, tStart){
    var dt = t - tStart;
    if(dt < 0 || dt > 2.5) return;
    var cx = W/2, cy = H/2;
    var minDim = Math.min(W,H);

    /* 隧道快速淡出（前 0.3s）*/
    var tunnelFade = Math.max(0, 1 - dt/0.3);
    if(tunnelFade > 0){
      ctx.save();
      ctx.globalAlpha = tunnelFade * 0.6;
      frame(t - dt*0.5);
      ctx.restore();
    }

    /* 全屏预爆闪光（0.3s 时一帧白闪）*/
    if(dt > 0.28 && dt < 0.34){
      ctx.save();
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    /* 冲击波粒子更新+绘制 */
    burstParticles = burstParticles.filter(function(bp){
      bp.life -= 0.016;
      if(bp.life <= 0) return false;
      bp.x += bp.vx; bp.y += bp.vy;
      bp.vx *= 0.96; bp.vy *= 0.96;
      ctx.save();
      ctx.globalAlpha = bp.life * 0.8;
      ctx.fillStyle = bp.c;
      ctx.shadowColor = bp.c; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(bp.x, bp.y, bp.r * bp.life, 0, 7); ctx.fill();
      ctx.restore();
      return true;
    });

    FINAL_CHARS.forEach(function(ch, i){
      var total = FINAL_CHARS.length;
      /* 字间距：中间宽、两侧略窄（弧形排列）*/
      var slotBase = minDim * 0.13;
      var arcOffset = Math.sin((i/(total-1) - 0.5) * Math.PI) * minDim * 0.03;
      var startX = cx - (total-1)*slotBase/2;
      var targetX = startX + i*slotBase;
      var targetY = cy - arcOffset;  /* 弧形：中间字略高 */
      var targetZ = 0;  /* 不同字不同深度层次 */
      if(i === 2) targetZ = -200;   /* 中间字「三」最靠前 */
      else if(i === 0 || i === 4) targetZ = 300;  /* 两侧字靠后 */

      var delay = i * 0.12;
      var local = Math.max(0, dt - delay);
      var flyDur = 0.6;
      var p = Math.min(local/flyDur, 1);
      var e = 1 - Math.pow(1-p, 4);  /* 更快的 ease-out */

      /* 从远处飞来，z 从 3000 → targetZ */
      var fromZ = 3000;
      var curZ = fromZ + (targetZ - fromZ) * e;
      var s = P/(P - curZ);

      /* 起点：从隧道方向（中心后方）飞出 */
      var fromX = cx + (Math.random()-0.5)*0;  /* 确定性 */
      var fromY = cy + (Math.random()-0.5)*0;
      var x = fromX + (targetX - fromX) * e;
      var y = fromY + (targetY - fromY) * e;

      /* 字号层次：中间字最大 */
      var sizeMult = (i === 2) ? 1.15 : (i === 1 || i === 3) ? 1.0 : 0.9;
      var fs = minDim * 0.13 * sizeMult * (0.2 + 0.8*e) * s;

      /* 到位检测 */
      var arrived = (p >= 1);
      var arrivalTime = delay + flyDur;
      var sinceArrival = dt - arrivalTime;

      /* 到位冲击波 */
      if(arrived && sinceArrival >= 0 && sinceArrival < 0.6 && !ch._burst){
        ch._burst = true;
        /* 炸开粒子 */
        for(var bi=0; bi<24; bi++){
          var ang = (bi/24)*Math.PI*2 + Math.random()*0.3;
          var spd = 3 + Math.random()*6;
          burstParticles.push({
            x: targetX, y: targetY,
            vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd,
            r: 2 + Math.random()*3,
            c: ch.glow,
            life: 0.8 + Math.random()*0.4
          });
        }
      }

      /* 到位闪光帧（短暂全白高光）*/
      var flashAlpha = 0;
      if(arrived && sinceArrival >= 0 && sinceArrival < 0.15){
        flashAlpha = (1 - sinceArrival/0.15);
      }

      /* 拖尾光迹（飞入过程）*/
      if(!arrived && p > 0.3){
        ctx.save();
        ctx.globalAlpha = (1-p)*0.3;
        ctx.strokeStyle = ch.glow; ctx.lineWidth = 3;
        ctx.shadowColor = ch.glow; ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.restore();
      }

      /* 多层发光晕（到位后呼吸）*/
      if(arrived){
        var breath = 1 + Math.sin(sinceArrival*8)*0.05;
        for(var ring=3; ring>=1; ring--){
          ctx.save();
          ctx.globalAlpha = 0.12 * (4-ring) / 3;
          ctx.fillStyle = ch.glow;
          ctx.shadowColor = ch.glow; ctx.shadowBlur = 50 * ring * breath;
          ctx.font = 'bold '+fs+'px "Microsoft YaHei","PingFang SC","SimHei",sans-serif';
          ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText(ch.t, targetX, targetY);
          ctx.restore();
        }
      }

      /* 主文字 */
      ctx.save();
      ctx.globalAlpha = Math.min(e, 1);
      ctx.translate(x, y);
      ctx.fillStyle = ch.c;
      ctx.shadowColor = ch.glow;
      ctx.shadowBlur = arrived ? 30 : 20*e;
      ctx.font = 'bold '+fs+'px "Microsoft YaHei","PingFang SC","SimHei",sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(ch.t, 0, 0);
      /* 白色内核 */
      ctx.globalAlpha = Math.min(e, 1) * 0.6;
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = ch.c; ctx.shadowBlur = 12;
      ctx.fillText(ch.t, 0, 0);
      ctx.restore();

      /* 到位闪光（白色高光叠加）*/
      if(flashAlpha > 0){
        ctx.save();
        ctx.globalAlpha = flashAlpha;
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = ch.glow; ctx.shadowBlur = 60;
        ctx.font = 'bold '+fs*1.1+'px "Microsoft YaHei","PingFang SC","SimHei",sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(ch.t, targetX, targetY);
        ctx.restore();
      }
    });

    /* 全部到位后的爆发效果 */
    var allArrived = dt > (0.12*4 + 0.6);
    if(allArrived){
      var sinceAll = dt - (0.12*4 + 0.6);

      /* 中心爆炸光环（多环冲击波）*/
      for(var er=0; er<4; er++){
        var ep = (sinceAll + er*0.15) % 1.0;
        var eRadius = ep * minDim * 0.5;
        ctx.save();
        ctx.globalAlpha = (1 - ep) * 0.25;
        ctx.strokeStyle = ['#4d8dff','#86a8ff','#ff7a3c','#a8d4ff'][er];
        ctx.lineWidth = 3 - er*0.5;
        ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 15;
        ctx.beginPath(); ctx.arc(cx, cy, eRadius, 0, 7); ctx.stroke();
        ctx.restore();
      }

      /* 底部标语 */
      if(sinceAll > 0.2){
        var subP = Math.min((sinceAll-0.2)/0.4, 1);
        ctx.save();
        ctx.globalAlpha = subP * 0.85;
        ctx.font = minDim*0.03+'px Arial,sans-serif';
        ctx.fillStyle = '#4d8dff';
        ctx.shadowColor = '#4d8dff'; ctx.shadowBlur = 12;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('D E E P   S E A   S A L M O N', cx, cy + minDim*0.12);
        ctx.restore();
      }

      /* 顶部副标题 */
      if(sinceAll > 0.4){
        var topP = Math.min((sinceAll-0.4)/0.4, 1);
        ctx.save();
        ctx.globalAlpha = topP * 0.7;
        ctx.font = 'bold '+minDim*0.025+'px "Microsoft YaHei",sans-serif';
        ctx.fillStyle = '#6db5ff';
        ctx.shadowColor = '#4d8dff'; ctx.shadowBlur = 10;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('— 烟台 · 虹鳟 · 刺身级 —', cx, cy - minDim*0.12);
        ctx.restore();
      }
    }
  }

  function tunnelAngle(t){ return Math.sin(t*2*Math.PI)*2.5; }

  /* 重置 burst 标志（每轮循环开始时）*/
  function resetBurst(){
    FINAL_CHARS.forEach(function(ch){ ch._burst = false; });
    burstParticles = [];
  }

  /* ----- 主循环 ----- */
  var LAST_HIT = null;
  var FINAL_DURATION = 2.5;
  var lastT = performance.now();
  var startGlobal = performance.now()/1000;

  function loop(now){
    var t = (now/1000 - startGlobal);
    var cycleT = t % (DUR + FINAL_DURATION);  /* 6秒隧道 + 2.5秒汇聚 */

    if(cycleT < DUR){
      /* 隧道阶段 */
      frame(cycleT);
    } else {
      /* 汇聚阶段 */
      var ft = cycleT - DUR;
      drawFinalGather(t, t - ft);
      if(ft > FINAL_DURATION){
        resetBurst();
        startGlobal = now/1000;  /* 重新开始 */
      }
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
