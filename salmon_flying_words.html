<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三文鱼飞字 · 深海三文鱼</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#060812}
  canvas{display:block;position:absolute;top:0;left:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* 三文鱼飞字动画 v2 · 词语汇集组合
   Phase 1: 散词从四面飞入→短暂停留→飞出（快速循环）
   Phase 2: 5个字"深""海""三""文""鱼"从不同方向飞向中心组合 */
(function(){
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W, H;
  function resize(){ W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  /* 三文鱼主题散词 */
  var WORDS = [
    {t:'烟台虹鳟',c:'#4d8dff'},
    {t:'刺身级',c:'#ff7a3c'},
    {t:'从头吃到尾',c:'#6db5ff'},
    {t:'清爽美味',c:'#059669'},
    {t:'低卡美食',c:'#a8d4ff'},
    {t:'Omega-3',c:'#ffb26a'},
    {t:'高蛋白',c:'#ff5d5d'},
    {t:'冰鲜直送',c:'#8bc4ff'},
    {t:'液氮急冻',c:'#4d8dff'},
    {t:'冷链直达',c:'#059669'},
    {t:'鲜切现做',c:'#ff7a3c'},
    {t:'溯源可查',c:'#a8d4ff'},
    {t:'一口深海',c:'#6db5ff'},
    {t:'黄海冷水团',c:'#4d8dff'},
    {t:'北纬37°',c:'#ffb26a'},
    {t:'烟台深海',c:'#4d8dff'},
    {t:'虹鳟刺身',c:'#ff7a3c'},
    {t:'鱼油精华',c:'#6db5ff'},
  ];

  /* 最终组合字 */
  var FINAL = [
    {t:'深', c:'#4d8dff'},
    {t:'海', c:'#6db5ff'},
    {t:'三', c:'#ff7a3c'},
    {t:'文', c:'#ffb26a'},
    {t:'鱼', c:'#a8d4ff'},
  ];

  /* 背景粒子 */
  var particles = [];
  for(var i=0; i<60; i++){
    particles.push({
      x: Math.random()*W, y: Math.random()*H,
      vx: (Math.random()-0.5)*0.4, vy: (Math.random()-0.5)*0.4,
      r: 0.5+Math.random()*2, a: 0.1+Math.random()*0.3,
      c: ['#4d8dff','#6db5ff','#ff7a3c','#a8d4ff'][Math.floor(Math.random()*4)]
    });
  }

  /* 状态机：散词循环 8 个 → 汇集组合 */
  var phase = 'scatter_in';   // scatter_in → scatter_hold → scatter_out → gather → final_glow → loop
  var scatterCount = 0;
  var MAX_SCATTER = 5;
  var scatterIdx = 0;
  var currentWord = null;
  var phaseT = 0;
  var IN_DUR = 0.35, HOLD_DUR = 0.7, OUT_DUR = 0.25;

  /* 组合字状态 */
  var gatherChars = [];
  function initGather(){
    gatherChars = FINAL.map(function(ch, i){
      var total = FINAL.length;
      var slotW = Math.min(W*0.13, 120);
      var startX = W/2 - (total-1)*slotW/2;
      return {
        text: ch.t, color: ch.c,
        targetX: startX + i*slotW,
        targetY: H/2,
        startX: Math.random()*W,
        startY: Math.random()*H,
        x: 0, y: 0,
        scale: 0.2, alpha: 0,
        delay: i * 0.12,
        arrived: false
      };
    });
  }

  function nextScatter(){
    currentWord = WORDS[scatterIdx % WORDS.length];
    scatterIdx++;
    currentWord.dir = Math.floor(Math.random()*4);
    currentWord.rot = (Math.random()-0.5)*0.6;
    phase = 'scatter_in';
    phaseT = 0;
  }
  nextScatter();

  function drawBg(){
    var g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.7);
    g.addColorStop(0, '#0a1024'); g.addColorStop(1, '#060812');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  }

  function drawParticles(){
    particles.forEach(function(p){
      p.x += p.vx; p.y += p.vy;
      if(p.x<0) p.x=W; if(p.x>W) p.x=0;
      if(p.y<0) p.y=H; if(p.y>H) p.y=0;
      ctx.fillStyle = p.c; ctx.globalAlpha = p.a;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  /* 散词绘制 */
  function drawScatterWord(dt){
    if(!currentWord) return;
    phaseT += dt;
    var cx = W/2, cy = H/2;
    var scale, alpha, ox=0, oy=0, rot=0;

    if(phase === 'scatter_in'){
      var p = Math.min(phaseT/IN_DUR, 1);
      var e = 1 - Math.pow(1-p, 3);
      scale = 0.3 + 0.7*e; alpha = e;
      var dist = (1-e)*350;
      if(currentWord.dir===0){ox=-dist;rot=-0.3*(1-e);}
      else if(currentWord.dir===1){ox=dist;rot=0.3*(1-e);}
      else if(currentWord.dir===2){oy=-dist;rot=0.2*(1-e);}
      else {oy=dist;rot=-0.2*(1-e);}
      if(p>=1){ phase='scatter_hold'; phaseT=0; }
    } else if(phase === 'scatter_hold'){
      var p2 = Math.min(phaseT/HOLD_DUR, 1);
      scale = 1.0 + Math.sin(p2*Math.PI)*0.015;
      alpha = 1.0;
      if(p2>=1){ phase='scatter_out'; phaseT=0; }
    } else {
      var p3 = Math.min(phaseT/OUT_DUR, 1);
      var e3 = p3*p3;
      scale = 1.0 - e3*0.3; alpha = 1.0 - e3;
      var d2 = e3*180;
      if(currentWord.dir===0) ox=d2;
      else if(currentWord.dir===1) ox=-d2;
      else if(currentWord.dir===2) oy=d2;
      else oy=-d2;
      if(p3>=1){
        scatterCount++;
        if(scatterCount >= MAX_SCATTER){
          phase = 'gather';
          phaseT = 0;
          initGather();
          currentWord = null;
          return;
        }
        nextScatter();
        return;
      }
    }

    ctx.save();
    ctx.translate(cx+ox, cy+oy);
    ctx.scale(scale, scale);
    ctx.rotate(rot + currentWord.rot*(phase==='scatter_in'?(1-Math.min(phaseT/IN_DUR,1)):0));
    var fs = Math.min(W,H)*0.08;
    ctx.font = 'bold '+fs+'px "Microsoft YaHei","PingFang SC","SimHei",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.globalAlpha = alpha*0.3; ctx.fillStyle=currentWord.c;
    ctx.shadowColor=currentWord.c; ctx.shadowBlur=35; ctx.fillText(currentWord.t,0,0);
    ctx.globalAlpha = alpha*0.6; ctx.shadowBlur=18; ctx.fillText(currentWord.t,0,0);
    ctx.globalAlpha = alpha; ctx.fillStyle='#fff';
    ctx.shadowColor=currentWord.c; ctx.shadowBlur=8; ctx.fillText(currentWord.t,0,0);
    ctx.restore();
  }

  /* 组合字绘制 */
  function drawGather(dt){
    phaseT += dt;
    var allArrived = true;
    gatherChars.forEach(function(ch){
      var localT = Math.max(0, phaseT - ch.delay);
      var p = Math.min(localT/0.8, 1);
      var e = 1 - Math.pow(1-p, 3);
      ch.x = ch.startX + (ch.targetX - ch.startX)*e;
      ch.y = ch.startY + (ch.targetY - ch.startY)*e;
      ch.scale = 0.2 + 0.8*e;
      ch.alpha = e;
      if(p < 1) allArrived = false;

      /* 拖尾光迹 */
      if(p < 0.95){
        ctx.save();
        ctx.globalAlpha = (1-p)*0.3;
        ctx.strokeStyle = ch.color; ctx.lineWidth = 2;
        ctx.shadowColor = ch.color; ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(ch.startX, ch.startY);
        ctx.lineTo(ch.x, ch.y);
        ctx.stroke();
        ctx.restore();
      }
    });

    /* 绘制字 */
    gatherChars.forEach(function(ch){
      ctx.save();
      ctx.translate(ch.x, ch.y);
      ctx.scale(ch.scale, ch.scale);
      var fs = Math.min(W,H)*0.12;
      ctx.font = 'bold '+fs+'px "Microsoft YaHei","PingFang SC","SimHei",sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.globalAlpha = ch.alpha*0.25; ctx.fillStyle=ch.color;
      ctx.shadowColor=ch.color; ctx.shadowBlur=45; ctx.fillText(ch.text,0,0);
      ctx.globalAlpha = ch.alpha*0.5; ctx.shadowBlur=25; ctx.fillText(ch.text,0,0);
      ctx.globalAlpha = ch.alpha; ctx.fillStyle='#fff';
      ctx.shadowColor=ch.color; ctx.shadowBlur=12; ctx.fillText(ch.text,0,0);
      ctx.restore();
    });

    /* 全部到位 → 最终闪光 */
    if(allArrived && phase === 'gather'){
      phase = 'final_glow';
      phaseT = 0;
    }
  }

  function drawFinalGlow(dt){
    phaseT += dt;
    /* 继续画组合字（稳定）*/
    gatherChars.forEach(function(ch){
      ctx.save();
      ctx.translate(ch.targetX, ch.targetY);
      var pulse = 1.0 + Math.sin(phaseT*4)*0.03;
      ctx.scale(pulse, pulse);
      var fs = Math.min(W,H)*0.12;
      ctx.font = 'bold '+fs+'px "Microsoft YaHei","PingFang SC","SimHei",sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      /* 脉冲发光增强 */
      var glowMult = 1 + Math.sin(phaseT*3)*0.3;
      ctx.globalAlpha = 0.25*glowMult; ctx.fillStyle=ch.color;
      ctx.shadowColor=ch.color; ctx.shadowBlur=55*glowMult; ctx.fillText(ch.text,0,0);
      ctx.globalAlpha = 0.5*glowMult; ctx.shadowBlur=28*glowMult; ctx.fillText(ch.text,0,0);
      ctx.globalAlpha = 1; ctx.fillStyle='#fff';
      ctx.shadowColor=ch.color; ctx.shadowBlur=14*glowMult; ctx.fillText(ch.text,0,0);
      ctx.restore();
    });

    /* 底部标语 */
    ctx.save();
    var subFs = Math.min(W,H)*0.035;
    ctx.font = subFs+'px Arial,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle = '#4d8dff';
    ctx.globalAlpha = Math.min(phaseT*2, 0.8);
    ctx.shadowColor = '#4d8dff'; ctx.shadowBlur = 15;
    ctx.fillText('D E E P   S E A   S A L M O N', W/2, H/2 + Math.min(W,H)*0.1);
    ctx.restore();

    /* 扩散光环 */
    if(phaseT > 0.3){
      var ringP = (phaseT - 0.3) % 1.5;
      for(var ri=0; ri<3; ri++){
        var rp = (ringP + ri*0.5) % 1.5;
        var r = rp * Math.min(W,H)*0.35;
        ctx.save();
        ctx.globalAlpha = (1 - rp/1.5)*0.2;
        ctx.strokeStyle = '#4d8dff'; ctx.lineWidth = 2;
        ctx.shadowColor = '#4d8dff'; ctx.shadowBlur = 15;
        ctx.beginPath(); ctx.arc(W/2, H/2, r, 0, 7); ctx.stroke();
        ctx.restore();
      }
    }

    /* 4秒后回到散词循环 */
    if(phaseT > 4.0){
      scatterCount = 0;
      phase = 'scatter_in';
      phaseT = 0;
      nextScatter();
    }
  }

  var lastT = performance.now();
  function loop(now){
    var dt = (now - lastT)/1000;
    lastT = now;

    drawBg();
    drawParticles();

    if(phase === 'scatter_in' || phase === 'scatter_hold' || phase === 'scatter_out'){
      drawScatterWord(dt);
    } else if(phase === 'gather'){
      drawGather(dt);
    } else if(phase === 'final_glow'){
      drawFinalGlow(dt);
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
